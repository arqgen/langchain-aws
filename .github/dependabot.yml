version: 2

registries:
  arqgen-pypi:
    type: python-index
    url: https://pypi.arqgen.com.br
    username: ${{secrets.PACKAGES_REGISTRY_ARQGEN_USERNAME}}
    password: ${{secrets.PACKAGES_REGISTRY_ARQGEN_PASSWORD}}

  arqgen-nuget:
    type: nuget-feed
    url: https://nuget.arqgen.com.br
    username: ${{secrets.PACKAGES_REGISTRY_ARQGEN_USERNAME}}
    password: ${{secrets.PACKAGES_REGISTRY_ARQGEN_PASSWORD}}

  arqgen-npm:
    type: npm-registry
    url: https://npm.arqgen.com.br
    username: ${{secrets.PACKAGES_REGISTRY_ARQGEN_USERNAME}}
    password: ${{secrets.PACKAGES_REGISTRY_ARQGEN_PASSWORD}}

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - arqgen-pypi
    insecure-external-code-execution: allow

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - arqgen-nuget

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - arqgen-npm
